<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜狗输入法 — 用户反馈分析报告</title>
<style>
:root{--bg:#0c0c10;--surface:#151520;--card:#1a1a28;--border:#2a2a3c;--text:#e4e4ef;--text-muted:#7c7c96}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:720px;width:100%;padding:40px 20px}
h1{font-size:2em;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#7c6cf0,#e17055);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--text-muted);font-size:1.05em;margin-bottom:40px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-decoration:none;color:var(--text);transition:all .25s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.card.emoji{border-top:3px solid #7c6cf0}
.card.emoji:hover{border-color:#7c6cf0;box-shadow:0 12px 40px rgba(124,108,240,.15)}
.card.wangzai{border-top:3px solid #e17055}
.card.wangzai:hover{border-color:#e17055;box-shadow:0 12px 40px rgba(225,112,85,.15)}
.card .icon{font-size:2.4em;margin-bottom:12px}
.card h2{font-size:1.2em;margin-bottom:6px}
.card .desc{font-size:.88em;color:var(--text-muted);line-height:1.6;margin-bottom:16px}
.card .stats{display:flex;gap:12px;font-size:.82em}
.card .stat-item{background:rgba(255,255,255,.05);padding:4px 10px;border-radius:6px}
.card .arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:1.2em;color:var(--text-muted);transition:transform .25s}
.card:hover .arrow{transform:translateY(-50%) translateX(4px);color:var(--text)}
@media(max-width:600px){.cards{grid-template-columns:1fr}h1{font-size:1.5em}}
</style>
</head>
<body>
<div class="container">
  <h1>搜狗输入法 · 用户反馈分析</h1>
  <div class="sub">2026年1月 — 5月 · Android + iOS 双平台数据</div>
  <div class="cards">
    <a class="card emoji" href="emoji_report.html">
      <div class="icon">😎</div>
      <h2>表情模块</h2>
      <div class="desc">Emoji、表情包、颜文字、AI配图等相关反馈分析</div>
      <div class="stats">
        <span class="stat-item">773 条反馈</span>
        <span class="stat-item">19 个分类</span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="card wangzai" href="wangzai_report.html">
      <div class="icon">🤖</div>
      <h2>AI汪仔模块</h2>
      <div class="desc">AI帮写、智能服务、陪伴宠物、搜索闪记等相关反馈分析</div>
      <div class="stats">
        <span class="stat-item">864 条反馈</span>
        <span class="stat-item">30 个分类</span>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>
